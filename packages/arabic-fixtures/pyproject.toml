[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arabic-fixtures"
version = "0.1.0"
description = "RTL test fixtures (Arabic, Persian, Hebrew) for checking PDF, OG-image and chart rendering"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Alaa Taieb" }]
requires-python = ">=3.8"
keywords = ["arabic", "rtl", "bidi", "persian", "hebrew", "pdf", "fixtures", "testing"]
classifiers = [
  "Intended Audience :: Developers",
  "Natural Language :: Arabic",
  "Natural Language :: Hebrew",
  "Natural Language :: Persian",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing :: Fonts",
]

[project.urls]
Homepage = "https://github.com/Alaa-Taieb/does-it-arabic/tree/main/packages/arabic-fixtures"
Repository = "https://github.com/Alaa-Taieb/does-it-arabic"
Issues = "https://github.com/Alaa-Taieb/does-it-arabic/issues"

# One fixtures.json is shared by the npm and the Python package: the wheel copies it into the module folder.
[tool.hatch.build.targets.wheel]
packages = ["arabic_fixtures"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures.json" = "arabic_fixtures/fixtures.json"

[tool.hatch.build.targets.sdist]
include = ["arabic_fixtures", "fixtures.json", "README.md", "LICENSE", "pyproject.toml"]
